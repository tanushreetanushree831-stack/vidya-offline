[browser]
gatherUsageStats = false      # no telemetry: the app must stay fully offline

[server]
fileWatcherType = "none"      # lighter on low-spec CPUs
maxUploadSize = 300           # MB

[theme]
base = "light"
primaryColor = "#6366f1"
backgroundColor = "#f8f7ff"
secondaryBackgroundColor = "#ffffff"
textColor = "#1e1b4b"
font = "sans serif"
